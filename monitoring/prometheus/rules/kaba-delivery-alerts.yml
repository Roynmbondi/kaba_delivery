# Règles d'alerte pour KABA-DELIVERY
groups:
  - name: kaba-delivery.rules
    rules:
      # Alerte si l'application est down
      - alert: KabaDeliveryDown
        expr: up{job="kaba-delivery"} == 0
        for: 1m
        labels:
          severity: critical
          service: kaba-delivery
        annotations:
          summary: "KABA-DELIVERY application is down"
          description: "KABA-DELIVERY application has been down for more than 1 minute."

      # Alerte sur l'utilisation CPU élevée
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # Alerte sur l'utilisation mémoire élevée
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      # Alerte sur l'espace disque faible
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.instance }}"

      # Alerte sur le taux d'erreur HTTP élevé
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: warning
          service: kaba-delivery
        annotations:
          summary: "High HTTP error rate"
          description: "HTTP error rate is above 5% for more than 2 minutes"

      # Alerte sur la latence élevée
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: kaba-delivery
        annotations:
          summary: "High response latency"
          description: "95th percentile latency is above 1 second for more than 5 minutes"

      # Alerte si Elasticsearch est down
      - alert: ElasticsearchDown
        expr: up{job="elasticsearch"} == 0
        for: 1m
        labels:
          severity: critical
          service: elasticsearch
        annotations:
          summary: "Elasticsearch is down"
          description: "Elasticsearch has been down for more than 1 minute"