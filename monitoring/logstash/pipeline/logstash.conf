# Pipeline Logstash pour KABA-DELIVERY
input {
  beats {
    port => 5044
  }
  
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    tags => ["kaba-delivery", "application"]
  }
}

filter {
  # Parsing des logs d'application
  if "kaba-delivery" in [tags] {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:log_message}" 
      }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    # Extraction des erreurs HTTP 500
    if [log_message] =~ /HTTP.*500/ {
      mutate {
        add_tag => ["http_error", "error_500"]
        add_field => { "error_type" => "http_500" }
      }
    }
    
    # Extraction des erreurs de base de données
    if [log_message] =~ /(database|sql|connection).*error/i {
      mutate {
        add_tag => ["database_error"]
        add_field => { "error_type" => "database" }
      }
    }
  }
  
  # Parsing des logs Docker
  if [container] {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
    }
  }
  
  # Enrichissement avec des métadonnées
  mutate {
    add_field => { 
      "environment" => "production"
      "application" => "kaba-delivery"
      "team" => "afriq-logistix"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "kaba-delivery-logs-%{+YYYY.MM.dd}"
    template_name => "kaba-delivery"
    template => "/usr/share/logstash/templates/kaba-delivery-template.json"
    template_overwrite => true
  }
  
  # Debug output (à supprimer en production)
  stdout {
    codec => rubydebug
  }
}