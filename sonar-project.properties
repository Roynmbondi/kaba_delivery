# Configuration SonarQube pour KABA-DELIVERY
sonar.projectKey=kaba-delivery
sonar.projectName=KABA-DELIVERY
sonar.projectVersion=1.0.0

# Informations sur l'organisation
sonar.organization=afriq-logistix

# Répertoires source et tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.config.js
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/vite.config.js

# Rapports de couverture
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encodage des fichiers
sonar.sourceEncoding=UTF-8

# Quality Gate personnalisé
sonar.qualitygate.wait=true

# Seuils de qualité
sonar.coverage.minimum=80.0
sonar.duplicated_lines_density.maximum=3.0

# Configuration JavaScript/TypeScript
sonar.javascript.environments=browser,node,jest