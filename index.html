<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KABA-DELIVERY - Solution de livraison du dernier kilomètre par AFRIQ-LOGISTIX" />
    <meta name="keywords" content="livraison, Douala, Cameroun, logistique, AFRIQ-LOGISTIX" />
    <meta name="author" content="AFRIQ-LOGISTIX S.A." />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="KABA-DELIVERY - Livraison Express Douala" />
    <meta property="og:description" content="Solution de livraison du dernier kilomètre à Douala, Cameroun" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kaba-delivery.afriq-logistix.com" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KABA-DELIVERY" />
    <meta name="twitter:description" content="Livraison express à Douala" />
    
    <title>KABA-DELIVERY | AFRIQ-LOGISTIX</title>
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Custom CSS for loading animation -->
    <style>
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #3498db, #2980b9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      .loading-logo {
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
        text-align: center;
      }
      
      .loading-subtitle {
        font-size: 1rem;
        margin-bottom: 2rem;
        opacity: 0.8;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .loading-text {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.7;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading screen when app is ready */
      .app-ready #loading-screen {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      
      /* Ensure smooth transition */
      #root {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      
      .app-ready #root {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">
        🚚 KABA-DELIVERY
      </div>
      <div class="loading-subtitle">
        AFRIQ-LOGISTIX S.A.
      </div>
      <div class="loading-spinner"></div>
      <div class="loading-text">
        Chargement de votre plateforme de livraison...
      </div>
    </div>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- App Loading Script -->
    <script>
      // Remove loading screen when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.body.classList.add('app-ready');
          // Remove loading screen from DOM after transition
          setTimeout(function() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
              loadingScreen.remove();
            }
          }, 500);
        }, 1000); // Show loading for at least 1 second
      });
      
      // Error handling
      window.addEventListener('error', function(e) {
        console.error('Application Error:', e.error);
        const loadingText = document.querySelector('.loading-text');
        if (loadingText) {
          loadingText.textContent = 'Erreur de chargement. Veuillez actualiser la page.';
          loadingText.style.color = '#e74c3c';
        }
      });
    </script>
    
    <!-- Main App Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
