<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CookBook </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f9f5f0; }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f0e8d8;
      border-top: 4px solid #f55f08;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    input:focus, textarea:focus, select:focus { outline: 2px solid #f43c05; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    
    @media (max-width: 768px) {
      header button {
        padding: 8px 15px !important;
        font-size: 12px !important;
      }
      
      .sidebar {
        display: none !important;
      }
      
      main {
        padding: 15px !important;
      }
      
      h2 {
        font-size: 20px !important;
      }
      
      .search-input {
        width: 100% !important;
        margin-bottom: 20px !important;
      }
      
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
        gap: 12px !important;
      }
      
      .card-image {
        height: 140px !important;
      }
      
      .card-content {
        padding: 12px !important;
      }
      
      .card-title {
        font-size: 14px !important;
      }
      
      .card-button {
        padding: 10px 12px !important;
        font-size: 12px !important;
      }
    }
    
    @media (max-width: 480px) {
      header {
        padding: 0 15px !important;
        height: 50px !important;
      }
      
      header h1 {
        font-size: 16px !important;
      }
      
      header button {
        padding: 6px 10px !important;
        font-size: 10px !important;
      }
      
      main {
        padding: 10px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
        gap: 8px !important;
      }
      
      .card-image {
        height: 110px !important;
      }
      
      .card-content {
        padding: 10px !important;
      }
      
      .card-title {
        font-size: 13px !important;
      }
      
      .card-ing {
        font-size: 11px !important;
      }
      
      .card-button {
        padding: 8px 10px !important;
        font-size: 11px !important;
      }
      
      .modal {
        padding: 20px !important;
      }
      
      .modal h2 {
        font-size: 18px !important;
      }
      
      .modal-image {
        height: 180px !important;
      }
      
      .form-buttons {
        flex-direction: column !important;
      }
      
      .form-buttons button {
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

localStorage.clear();

const DB_KEY = 'cookbook_recettes';

const defaultRecettes = [
  { id: 1, nom: "salade rouge", categorie: "Entrées",
    ingredients: ["choux rouge","Carottes","4 tomates"],
    instructions:["pas necessaire de faire cuire"],
    image: "./image/OIP.jpg"
  },
  { id: 2, nom: "crudité", categorie: "Entrées",
    ingredients: ["choux ","tomate","Carottes","oignons"],
    instructions: ["pas necessaire de faire cuire"],
    image: "./image/OIP.jpg"
  },
  { id: 3, nom: "pommes sauter", categorie: "Plats",
    ingredients: ["pommes de terre","huille","viande","condiment"],
    instructions: ["faire cuire pendant 45min"],
    image: "./image/OIP.jpg"
  },
  { id: 4, nom: "eru", categorie: "Plats",
    ingredients: ["feuille de eru","viande","huile rouge"],
    instructions: ["faire cuire pendant 45min"],
    image: "./image/OIP.jpg"
  },
  { id: 5, nom: "gateau", categorie: "Desserts",
    ingredients: ["farine","sucre","lait"],
    instructions: "faire cuire",
    image: "./image/OIP.jpg"
  },
  { id: 6, nom: "fruits", categorie: "Desserts",
    ingredients: ["pasteque","ananas","raisin"],
    instructions: "pas necessaire de faire cuir",
    image: "./image/OIP.jpg"
  }
];

const getRecettes = () => new Promise((resolve, reject) => {
  setTimeout(() => {
    try {
      if (!localStorage.getItem(DB_KEY)) {
        localStorage.setItem(DB_KEY, JSON.stringify(defaultRecettes));
      }
      resolve(JSON.parse(localStorage.getItem(DB_KEY)));
    } catch (e) { reject(new Error("Erreur lors du chargement des recettes")); }
  }, 600);
});

const addRecette = (nouvelle) => new Promise((resolve, reject) => {
  setTimeout(() => {
    try {
      const recettes = JSON.parse(localStorage.getItem(DB_KEY));
      const newId = recettes.length > 0 ? Math.max(...recettes.map(r => r.id)) + 1 : 1;
      const avecId = { ...nouvelle, id: newId };
      recettes.push(avecId);
      localStorage.setItem(DB_KEY, JSON.stringify(recettes));
      resolve(avecId);
    } catch (e) { reject(new Error("Erreur lors de l'ajout de la recette")); }
  }, 400);
});

function Header({ onAjouterClick }) {
  return (
    <header style={{ backgroundColor:'#1a1a1a', display:'flex', justifyContent:'space-between',
      alignItems:'center', padding:'0 30px', height:'60px', position:'sticky', top:0, zIndex:100 }}>
      <h1 style={{ color:'white', fontSize:'20px', fontStyle:'italic', fontWeight:'bold' }}>CookBook</h1>
      <button onClick={onAjouterClick} style={{
        backgroundColor:'#f97509', color:'white', border:'none', borderRadius:'25px',
        padding:'10px 22px', cursor:'pointer', fontWeight:'bold', fontSize:'14px'
      }}>Ajoutez une recette</button>
    </header>
  );
}

function Sidebar({ categories, categorieActive, onCategorieSelect, recettes }) {
  const compter = (cat) => cat === 'Toutes' ? recettes.length : recettes.filter(r => r.categorie === cat).length;

  return (
    <aside style={{ width:'180px', minWidth:'180px', borderRight:'1px solid #e0d8ce',
      padding:'25px 15px', backgroundColor:'#f9f5f0', maxHeight:'calc(100vh - 60px)', overflowY:'auto' }}>
      <p style={{ fontSize:'11px', color:'#aaa', fontWeight:'bold', letterSpacing:'1px', marginBottom:'15px' }}>
        CATÉGORIES
      </p>
      {['Toutes', ...categories].map(cat => {
        const actif = categorieActive === cat;
        return (
          <div key={cat} onClick={() => onCategorieSelect(cat)}
            style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
              padding:'10px 12px', borderRadius:'8px', cursor:'pointer', marginBottom:'4px',
              backgroundColor: actif ? '#f97509' : 'transparent',
              color: actif ? 'white' : '#333', fontWeight: actif ? 'bold' : 'normal',
              fontSize:'15px', transition:'background 0.15s' }}>
            <span>{cat}</span>
            <span style={{ backgroundColor: actif ? 'rgba(255,255,255,0.3)' : '#e0d8ce',
              borderRadius:'12px', padding:'2px 8px', fontSize:'12px',
              color: actif ? 'white' : '#777' }}>
              {compter(cat)}
            </span>
          </div>
        );
      })}
    </aside>
  );
}

function RecipeCard({ recette, onVoirDetail }) {
  return (
    <div style={{
      backgroundColor:'white', 
      borderRadius:'12px', 
      overflow:'hidden', 
      boxShadow:'0 4px 12px rgba(0,0,0,0.08)',
      transition:'transform 0.2s, box-shadow 0.2s', 
      padding:'0'
    }} onMouseEnter={(e) => {
      e.currentTarget.style.transform = 'translateY(-4px)';
      e.currentTarget.style.boxShadow = '0 8px 20px rgba(0,0,0,0.12)';
    }} onMouseLeave={(e) => {
      e.currentTarget.style.transform = 'translateY(0)';
      e.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.08)';
    }}>
      <img src={recette.image} alt={recette.nom}
        style={{ width:'100%', height:'200px', objectFit:'cover', display:'block' }} className="card-image" />
      <div style={{ padding:'16px' }} className="card-content">
        <p style={{ fontSize:'11px', color:'#999', fontWeight:'bold', letterSpacing:'0.5px',
          textTransform:'uppercase', margin:'0 0 8px' }}>
          {recette.categorie}
        </p>
        <h3 style={{ fontSize:'16px', fontWeight:'bold', color:'#222', margin:'0 0 8px' }} className="card-title">
          {recette.nom}
        </h3>
        <p style={{ fontSize:'13px', color:'#666', margin:'0 0 15px', lineHeight:'1.5' }} className="card-ing">
          {recette.ingredients.slice(0, 3).join(', ')}
          {recette.ingredients.length > 3 ? '...' : ''}
        </p>
        <button 
          onClick={(e) => {
            e.stopPropagation();
            onVoirDetail(recette);
          }}
          style={{
            width:'100%',
            backgroundColor:'#f97509',
            color:'white',
            border:'none',
            borderRadius:'8px',
            padding:'12px 16px',
            fontSize:'14px',
            fontWeight:'bold',
            cursor:'pointer',
            transition:'background 0.2s'
          }}
          className="card-button"
          onMouseEnter={(e) => {
            e.currentTarget.style.backgroundColor = '#e86400';
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.backgroundColor = '#f97509';
          }}
        >
          Voir détails
        </button>
      </div>
    </div>
  );
}

function RecipeList({ recettes, onVoirDetail }) {
  if (recettes.length === 0) {
    return <p style={{ textAlign:'center', color:'#aaa', padding:'40px' }}>Aucune recette trouvée</p>;
  }
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(250px, 1fr))',
      gap:'20px', marginBottom:'30px' }} className="grid">
      {recettes.map(r => <RecipeCard key={r.id} recette={r} onVoirDetail={onVoirDetail} />)}
    </div>
  );
}

function RecipeDetail({ recette, onFermer }) {
  return (
    <div onClick={onFermer} style={{ position:'fixed', top:0, left:0, right:0, bottom:0,
      backgroundColor:'rgba(0,0,0,0.6)', display:'flex', justifyContent:'center', alignItems:'center', zIndex:1000, padding:'10px' }}>
      <div onClick={e => e.stopPropagation()} style={{ backgroundColor:'white', borderRadius:'16px',
        maxWidth:'500px', width:'90%', maxHeight:'90vh', overflowY:'auto', padding:'30px', position:'relative' }} className="modal">
        <button onClick={onFermer} style={{ position:'absolute', top:'15px', right:'15px',
          backgroundColor:'#f0e8d8', border:'none', borderRadius:'50%', width:'36px', height:'36px',
          fontSize:'20px', cursor:'pointer' }}>✕</button>
        <img src={recette.image} alt={recette.nom}
          style={{ width:'100%', height:'250px', objectFit:'cover', borderRadius:'8px', marginBottom:'20px' }} className="modal-image" />
        <p style={{ fontSize:'12px', color:'#999', fontWeight:'bold', letterSpacing:'1px', textTransform:'uppercase' }}>
          {recette.categorie}
        </p>
        <h2 style={{ fontSize:'24px', fontWeight:'bold', color:'#222', margin:'8px 0 20px' }}>
          {recette.nom}
        </h2>
        <h3 style={{ fontSize:'14px', fontWeight:'bold', color:'#e8a020', textTransform:'uppercase', marginBottom:'10px' }}>
          Ingrédients
        </h3>
        <ul style={{ marginBottom:'20px', paddingLeft:'20px' }}>
          {recette.ingredients.map((ing, i) => <li key={i} style={{ marginBottom:'6px', fontSize:'14px' }}>{ing}</li>)}
        </ul>
        <h3 style={{ fontSize:'14px', fontWeight:'bold', color:'#e8a020', textTransform:'uppercase', marginBottom:'10px' }}>
          Instructions
        </h3>
        <p style={{ fontSize:'14px', lineHeight:'1.8', whiteSpace:'pre-wrap', color:'#444' }}>
          {recette.instructions}
        </p>
      </div>
    </div>
  );
}

function AddRecipeForm({ onAjout, onFermer }) {
  const [form, setForm] = useState({ nom:'', categorie:'selectionner', ingredients:'', instructions:'', image:'' });
  const [erreurs, setErreurs] = useState({});
  const [loading, setLoading] = useState(false);

  const handleChange = (e) => {
    setForm({ ...form, [e.target.name]: e.target.value });
  };

  const valider = () => {
    const e = {};
    if (!form.nom.trim()) e.nom = "veiller inserer le nom";
    if (!form.ingredients.trim()) e.ingredients = "au moins un ingredient";
    if (!form.instructions.trim()) e.instructions = "au moins une instruction";
    setErreurs(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = async () => {
    if (!valider()) return;
    setLoading(true);
    await new Promise(r => setTimeout(r, 1000));
    await onAjout({
      nom: form.nom,
      categorie: form.categorie,
      ingredients: form.ingredients.split('\n').filter(i => i.trim()),
      instructions: form.instructions,
      
    });
    setLoading(false);
    onFermer();
  };

  const inputStyle = (field) => ({ width:'100%', padding:'10px 12px', border:'1px solid #ddd',
    borderRadius:'8px', fontSize:'14px', fontFamily:'inherit', backgroundColor:'white' });

  return (
    <div onClick={onFermer} style={{ position:'fixed', top:0, left:0, right:0, bottom:0,
      backgroundColor:'rgba(0,0,0,0.6)', display:'flex', justifyContent:'center', alignItems:'center', zIndex:1000, padding:'10px' }}>
      <div onClick={e => e.stopPropagation()} style={{ backgroundColor:'white', borderRadius:'16px',
        maxWidth:'500px', width:'90%', maxHeight:'90vh', overflowY:'auto', padding:'30px', position:'relative' }} className="modal">
        <button onClick={onFermer} style={{ position:'absolute', top:'15px', right:'15px',
          backgroundColor:'#f0e8d8', border:'none', borderRadius:'50%', width:'36px', height:'36px',
          fontSize:'20px', cursor:'pointer' }}>✕</button>
        <h2 style={{ fontSize:'20px', fontWeight:'bold', marginBottom:'20px' }}>Nouvelle Recette</h2>

        <div style={{ marginBottom:'16px' }}>
          <label style={{ display:'block', fontSize:'14px', fontWeight:'600', color:'#444', marginBottom:'6px' }}>Nom *</label>
          <input style={inputStyle()} type="text" name="nom" value={form.nom} onChange={handleChange}
            placeholder="entrer le nom " />
          {erreurs.nom && <p style={{ color:'#e53e3e', fontSize:'12px', margin:'4px 0 0' }}>{erreurs.nom}</p>}
        </div>

        <div style={{ marginBottom:'16px' }}>
          <label style={{ display:'block', fontSize:'14px', fontWeight:'600', color:'#444', marginBottom:'6px' }}>Catégorie *</label>
          <select style={inputStyle()} name="categorie" value={form.categorie} onChange={handleChange}>
            <option value="Entrées">Entrées</option>
            <option value="Plats">Plats</option>
            <option value="Desserts">Desserts</option>
          </select>
        </div>

        <div style={{ marginBottom:'16px' }}>
          <label style={{ display:'block', fontSize:'14px', fontWeight:'600', color:'#444', marginBottom:'6px' }}>
            Ingrédients * (un par ligne)
          </label>
          <textarea style={{ ...inputStyle('ingredients'), resize:'vertical' }} name="ingredients"
            value={form.ingredients} onChange={handleChange} rows={4}
            placeholder={""} />
          {erreurs.ingredients && <p style={{ color:'#e53e3e', fontSize:'12px', margin:'4px 0 0' }}>{erreurs.ingredients}</p>}
        </div>

        <div style={{ marginBottom:'16px' }}>
          <label style={{ display:'block', fontSize:'14px', fontWeight:'600', color:'#444', marginBottom:'6px' }}>Instructions *</label>
          <textarea style={{ ...inputStyle('instructions'), resize:'vertical' }} name="instructions"
            value={form.instructions} onChange={handleChange} rows={5}
            placeholder={""} />
          {erreurs.instructions && <p style={{ color:'#e53e3e', fontSize:'12px', margin:'4px 0 0' }}>{erreurs.instructions}</p>}
        </div>

        <div style={{ display:'flex', justifyContent:'flex-end', gap:'10px', marginTop:'10px' }} className="form-buttons">
          <button onClick={onFermer} style={{ backgroundColor:'white', color:'#666',
            border:'1px solid #ddd', borderRadius:'25px', padding:'10px 20px', cursor:'pointer', fontSize:'14px' }}>
            Annuler
          </button>
          <button onClick={handleSubmit} disabled={loading}
            style={{ backgroundColor:'#f97509', color:'white', border:'none', borderRadius:'25px',
              padding:'10px 25px', cursor:'pointer', fontWeight:'bold', fontSize:'14px',
              opacity: loading ? 0.7 : 1 }}>
            {loading ? 'Ajout en cours...' : 'Ajouter la recette'}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [recettes, setRecettes] = useState([]);
  const [categorieActive, setCategorieActive] = useState('Toutes');
  const [recetteActive, setRecetteActive] = useState(null);
  const [recherche, setRecherche] = useState('');
  const [loading, setLoading] = useState(true);
  const [erreur, setErreur] = useState(null);
  const [showForm, setShowForm] = useState(false);

  useEffect(() => { chargerRecettes(); }, []);

  const chargerRecettes = async () => {
    setLoading(true); setErreur(null);
    try {
      const data = await getRecettes();
      setRecettes(data);
    } catch (e) {
      setErreur(e.message);
    } finally {
      setLoading(false);
    }
  };

  const categories = [...new Set(recettes.map(r => r.categorie))];

  const recettesFiltrees = recettes.filter(r => {
    const matchCat = categorieActive === 'Toutes' || r.categorie === categorieActive;
    const matchSearch = r.nom.toLowerCase().includes(recherche.toLowerCase());
    return matchCat && matchSearch;
  });

  const handleAjout = async (nouvelle) => {
    const ajoutee = await addRecette(nouvelle);
    setRecettes(prev => [...prev, ajoutee]);
  };

  return (
    <div style={{ minHeight:'100vh', backgroundColor:'#f9f5f0', display:'flex', flexDirection:'column' }}>
      <Header onAjouterClick={() => setShowForm(true)} />

      <div style={{ display:'flex', flex:1, minHeight:'calc(100vh - 60px)' }}>
        <Sidebar categories={categories} categorieActive={categorieActive}
          onCategorieSelect={setCategorieActive} recettes={recettes} />

        <main style={{ flex:1, padding:'30px', overflowY:'auto' }}>
          <h2 style={{ fontSize:'26px', fontWeight:'bold', color:'#222', margin:'0 0 10px' }}>
            Toutes les recettes
          </h2>

          <input type="text" placeholder="Chercher une recette..."
            value={recherche} onChange={e => setRecherche(e.target.value)}
            style={{ width:'350px', maxWidth:'100%', padding:'12px 16px', borderRadius:'25px',
              border:'1px solid #ddd', fontSize:'14px', marginBottom:'25px',
              backgroundColor:'white', display:'block' }} className="search-input" />

          {loading && (
            <div style={{ textAlign:'center', color:'#aaa', padding:'40px' }}>
              <div className="spinner"></div>
              <p>Chargement des recettes...</p>
            </div>
          )}

          {erreur && (
            <div style={{ backgroundColor:'#fff5f5', border:'1px solid #feb2b2', borderRadius:'8px',
              padding:'20px', textAlign:'center', color:'#e53e3e' }}>
              <p> {erreur}</p>
              <button onClick={chargerRecettes}
                style={{ marginTop:'10px', backgroundColor:'#e8a020', color:'white', border:'none',
                  borderRadius:'20px', padding:'8px 20px', cursor:'pointer' }}>
                Réessayer
              </button>
            </div>
          )}

          {!loading && !erreur && (
            <RecipeList recettes={recettesFiltrees} onVoirDetail={setRecetteActive} />
          )}
        </main>
      </div>

      {recetteActive && <RecipeDetail recette={recetteActive} onFermer={() => setRecetteActive(null)} />}

      {showForm && <AddRecipeForm onAjout={handleAjout} onFermer={() => setShowForm(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
